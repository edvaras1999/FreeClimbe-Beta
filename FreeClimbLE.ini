; FreeClimbLE.ini - afinacoes da escalada na parede.
; COPIE este ficheiro para:  Data\SKSE\Plugins\FreeClimbLE.ini   (ou a pasta do mod no MO2)
; E RELIDO CADA VEZ QUE O PERSONAGEM SE AGARRA a parede: pode editar com o jogo aberto e testar
; logo a seguir, SEM recompilar e SEM reiniciar. (Unidades do Skyrim: 1 unidade ~ 1,4 cm.)

[Climb]
; Ate onde procura a parede quando carrega em saltar (alcance).
Reach=110

; Distancia do personagem a parede enquanto agarrado (o padrao do mod original e 30).
; Desde o passo 25 o corpo e colocado em relacao a este valor como o original faz (as palmas ficam
; a ~5 unidades da superficie), por isso NAO deve ser preciso mexer. Se as maos ainda atravessarem a
; parede, aumente 2-3; se o corpo ficar longe, diminua.
WallGap=30

; Velocidades na parede (unidades por segundo). Os padroes sao os do FreeClimb original.
ClimbSpeed=100
DownSpeed=78
SideSpeed=82

; Bordas por onde passa POR CIMA ao chegar ao topo (altura acima dos pes). Fora disto, nao passa.
MinLedge=80
MaxLedge=180

; Altura da cabeca: e a esta altura que o plugin procura o topo da parede.
HeadHeight=125

; 1 = saltar junto a uma parede agarra-se SEMPRE (e sobe com W, desce com S).
; 0 = se a parede for baixa (entre MinLedge e MaxLedge) passa logo por cima, sem agarrar.
AlwaysCling=1

; 1 = vira o personagem de frente para a parede enquanto agarrado (e ao dar a volta a esquinas).
; Se o personagem comecar a rodar de forma estranha, ponha 0.
FaceWall=1

; Saltos na parede (direcao + Salto): HopScale multiplica a distancia (1 = a da animacao: ~105 unidades
; para os lados, ~55 para cima); HopSpeed multiplica a velocidade (1 = a duracao da animacao, 1.3 = mais rapido).
HopScale=1.8
HopSpeed=1.1

; Distancia maxima a parede para o salto agarrar (o personagem e puxado ate ela). Mantenha pequena (60-70):
; um valor grande teletransporta o personagem por cima de obstaculos.
AttachReach=65

; 1 = saltos suaves (comecam e acabam devagar); 0 = velocidade constante.
HopEase=1

; 1 = o personagem e "teletransportado" a cada frame para a nova posicao (comportamento atual);
; 0 = tenta mover sem esse teletransporte. Se a CAMARA parecer atrasada ou aos solavancos, tente 0.
Warp=1

; Como se entra na parede:
;   0 = Salto sozinho junto a uma parede (PADRAO).
;   1 = Salto + W + A + D premidos JUNTOS (como o mod original, evita entrar sem querer).
;       AVISO: muitos teclados (sobretudo de portatil) nao conseguem registar estas 4 teclas ao mesmo tempo.
; No ar, o mesmo: carregue em Salto a meio de um salto perto de uma parede.
EntryMode=0

; Alcance para apanhar uma parede a meio de um salto.
AirReach=90

; Corrida na parede (segure Shift + direcao enquanto agarrado). Padroes do FreeClimb original.
WallRunSpeed=379.5
WallRunDiagonal=1.15

; 1 = ao andar de lado, quando a parede acaba mas ha outra ao alcance de um salto, salta sozinho para ela.
ContextHops=1

; Velocidade da animacao de apanhar a parede (1 = a da animacao; 1.5 = mais rapido).
CatchSpeed=1.5

; ---------------------------------------------------------------------------------------------
; PASSO 25 - MOTOR DE POSE (animacoes)
; ---------------------------------------------------------------------------------------------
; Como a pose chega ao esqueleto:
;   1 = (PADRAO) a pose e escrita nos ossos ANTES de o jogo atualizar o esqueleto, em todas as passagens,
;       e e o proprio jogo que a propaga (como o mod original). O corpo, a pele, a camara e as armas seguem.
;   0 = modo antigo (pose escrita DEPOIS de o jogo acabar, so numa passagem). So para comparar se algo correr mal.
PoseMode=1

; Fusoes, em segundos (0 = corte seco):
;   EntryBlend  = do movimento normal do jogo para a pose da escalada
;   ExitBlend   = da pose da escalada de volta ao movimento normal do jogo (ao largar a parede)
;   MotionBlend = ao trocar de animacao (parado -> subir -> correr, etc.)
EntryBlend=0.14
ExitBlend=0.22
MotionBlend=0.15

; Altura do corpo durante a CORRIDA na parede (unidades; positivo = mais alto). O padrao (0) e o do
; original; se o corpo deitado na corrida parecer baixo/alto em relacao a camara, afine aqui (ex.: 25).
RunHeight=0
